name: CI

# Layer 1 robot checks (see docs/decisions.md D000).
# Every PR runs these. The merge button is greyed out until all pass.
#
# These triggers were filtered to `main`. This repository's default branch is
# `master`, and no `main` branch has ever existed — so this workflow ran ZERO
# times across 45 branches and every merged PR. "CI is green" throughout
# CLAUDE.md, docs/today.md and docs/backlog.md was never an observed fact;
# nothing was gated on anything.
#
# `pull_request` is deliberately left unfiltered so CI runs on every PR
# regardless of the target branch, and can't be silently disabled again by a
# branch rename.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

  # Vercel target for the deploy-production job at the bottom of this file.
  # These two are identifiers, not credentials — Vercel's own bot prints them
  # in its public PR comments — so they live here rather than in secrets, and
  # the only thing you have to add is VERCEL_TOKEN.
  VERCEL_ORG_ID: "team_mQlD3mcz32rsA4HcPOBRiW6b"
  VERCEL_PROJECT_ID: "prj_OE66Qpr8IdTXwLG6BOzevWYagRcl"

# ⚠️ THE CI PLACEHOLDER KEYS BELOW MUST NEVER BE WORKFLOW-LEVEL `env`.
#
# They used to be, and it took production down on 2026-08-17.
#
# A workflow-level `env` block applies to EVERY job, including
# `deploy-production`. `NEXT_PUBLIC_*` values are inlined into the browser
# bundle at BUILD time, and a variable already present in the process
# environment WINS over the values `vercel pull` writes to
# `.vercel/.env.production.local`. So `vercel build --prod` compiled the real
# production bundle with `ci-placeholder.clerk.accounts.dev` as the Clerk
# publishable key, `vercel deploy --prebuilt --prod` promoted it, and every
# page on app.tryreviewbox.com answered:
#
#   {"errors":[{"message":"Invalid host","code":"host_invalid"}]}
#
# The deploy job reported SUCCESS the whole time — it deployed exactly what it
# was told to build.
#
# Rule: any job that DEPLOYS must inherit no build-time app config from CI.
# Placeholders belong to the jobs that compile or run the app for TESTS only,
# which is why each one now carries its own copy.
#
# The publishable key must be STRUCTURALLY valid, not just a placeholder
# string: Clerk base64-decodes it to find the frontend API domain, and the old
# `pk_test_ci-placeholder` threw "Publishable key not valid" on every request,
# so `next dev` never became ready and the e2e job timed out after 120s. The
# value below decodes to `ci-placeholder.clerk.accounts.dev$`.

jobs:
  build-and-typecheck:
    name: Build + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Test-only placeholders — see the warning above the `jobs:` key. These
    # compile a throwaway bundle that is never deployed.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Test-only placeholders — see the warning above the `jobs:` key.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Test-only placeholders — see the warning above the `jobs:` key.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # NON-BLOCKING until real Clerk test credentials are added as repo secrets.
  #
  # All 20 specs fail, and the first CI run showed exactly why: the dummy key
  # above is structurally valid (so `next dev` boots) but names a Clerk
  # instance that does not exist, so Clerk's edge answers every request with
  #
  #   {"errors":[{"message":"Invalid host","code":"host_invalid"}]}
  #
  # …including the purely public marketing pages. No app change can fix that
  # from this side; the tests need credentials that resolve to a real Clerk
  # instance. (Note the product-side implication, tracked as BUG-040: a Clerk
  # outage currently takes the marketing site and legal pages down with it.)
  #
  # To make this blocking (recommended — it is the only check that exercises
  # the app as a user):
  #   1. Clerk dashboard → a dedicated CI development instance → API keys
  #   2. GitHub → Settings → Secrets and variables → Actions → add
  #      CLERK_PUBLISHABLE_KEY_TEST and CLERK_SECRET_KEY_TEST
  #   3. Reference them in the `env:` block below and drop continue-on-error
  # Tracked as BUG-037 in docs/BUGS.md.
  e2e-tests:
    name: E2E tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    # Test-only placeholders — see the warning above the `jobs:` key.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Blocks the merge. Nothing is currently critical, so a red here is a
      # genuine new problem rather than pre-existing debt.
      #
      # Wrapped in a retry because a bare `npm audit` conflates two very
      # different outcomes — both exit 1:
      #   1. a critical advisory exists  → must block the merge
      #   2. the registry answered 4xx/5xx → tells us nothing at all
      # We hit (2) on c844e9d: the legacy /security/audits/quick endpoint, which
      # npm's own notice says is being retired, returned "400 Invalid package
      # tree" for a lockfile that had audited clean 44 minutes earlier. Failing
      # the merge gate on npm's uptime is how a pipeline gets ignored.
      #
      # So: retry transient registry errors, fail loudly on real advisories,
      # and if the registry never answers, pass with a visible warning rather
      # than a silent green — the run is UNVERIFIED, and the log says so.
      - name: npm audit (critical blocks the merge)
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level=critical 2>&1); then
              echo "$out"
              echo "No critical advisories."
              exit 0
            fi
            if grep -qE "audit endpoint returned an error|Invalid package tree|ENETUNREACH|ETIMEDOUT|socket hang up" <<<"$out"; then
              echo "::warning::npm audit registry error on attempt ${attempt}/3 — retrying."
              tail -n 5 <<<"$out"
              sleep $((attempt * 5))
              continue
            fi
            echo "$out"
            echo "::error::Critical advisories found — see the npm audit output above."
            exit 1
          done
          echo "::warning::npm audit could not reach the registry after 3 attempts. Advisory status is UNVERIFIED for this run, not clean."

      # Reports but does not block. `--audit-level=high` cannot pass today: the
      # remaining high advisories are eslint-toolchain and vitest devDeps whose
      # only fix is a semver-major jump (ESLint 9, eslint-config-next 16 → which
      # pulls Next 16), plus next/postcss/sharp which have NO fix published yet.
      # CLAUDE.md defers the Next 16 upgrade until it is stable. Blocking on
      # this would mean a permanently red pipeline, which is how a pipeline
      # gets ignored. Tracked as BUG-036 in docs/BUGS.md — revisit with Next 16.
      - name: npm audit (high severity — advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── Production deploy ───────────────────────────────────────────────────────
  #
  # Deploys master to Vercel through the CLI instead of Vercel's Git
  # integration.
  #
  # Why: Vercel's Git integration only builds a commit whose *author* is a
  # member of the Vercel team. The repo owner's GitHub account (nimesh4992) is
  # not a member of the Vercel "ReviewBox" team, so every push and every
  # Redeploy of master was answered with:
  #
  #   Deployment Blocked — the commit author did not have contributing access
  #   The Hobby Plan does not support collaboration for private repositories
  #
  # That check does not apply to CLI deploys, which authenticate with a token
  # belonging to the team itself. So this path does not care who authored or
  # pushed the commit, and it keeps the project on the Hobby plan.
  #
  # Gated on the four blocking jobs so a red master cannot reach production.
  # e2e-tests is deliberately excluded — it is advisory and currently cannot
  # pass without Clerk test credentials (BUG-037).
  deploy-production:
    name: Deploy to production
    needs: [build-and-typecheck, lint, unit-tests, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      # FAIL when the token is absent — do not skip.
      #
      # This originally skipped, reasoning that "a red pipeline that everyone
      # learns to ignore is worse than no pipeline". That reasoning holds only
      # if some other path still deploys. Here none does: the comment above
      # this job records that Vercel's Git integration refuses to build master
      # for this repo ("the commit author did not have contributing access"),
      # which is why this CLI job exists at all. So with the token missing,
      # BOTH production paths are closed and nothing reaches production.
      #
      # What that produced in practice: PR #77 merged on 2026-08-16, this job
      # reported a green "Deploy to production", every deploy step inside it
      # was skipped, and the code never shipped. A green check that means
      # "deployed nothing" is precisely the silent-success failure the whole
      # audit round was about — the pipeline should not model it differently
      # from the product.
      #
      # Red master here is correct and actionable: it means master is genuinely
      # not in production. Fix by adding the secret, not by softening this.
      - name: Check for VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set, so master was NOT deployed to production." >&2
            {
              echo "### ❌ Production deploy did not run"
              echo ""
              echo "\`VERCEL_TOKEN\` is missing, and Vercel's Git integration does not"
              echo "build master for this repo — so **this commit is not in production.**"
              echo ""
              echo "To fix: create a token at Vercel → Account Settings → Tokens (scoped to"
              echo "the ReviewBox team), then add it as \`VERCEL_TOKEN\` under"
              echo "Settings → Secrets and variables → Actions. Re-run this job afterwards."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # `vercel pull` fetches the project's own production environment
      # variables, so the real Clerk / Supabase / Groq values come from Vercel
      # and are never duplicated into GitHub secrets.
      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          # VERCEL_ORG_ID and VERCEL_PROJECT_ID come from the workflow-level
          # env block and are already present in every step's environment.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # The check that would have caught the 2026-08-17 outage before it
      # reached a customer. `vercel pull` writes the real production values
      # here; if the Clerk publishable key is missing or still points at the
      # CI placeholder instance, building would bake a dead key into the
      # browser bundle and every page would answer "Invalid host". Fail here,
      # loudly, instead of deploying it and reporting success.
      - name: Verify pulled production env is real
        run: |
          envfile=".vercel/.env.production.local"
          if [ ! -f "$envfile" ]; then
            echo "::error::$envfile is missing — vercel pull did not fetch the production environment." >&2
            exit 1
          fi
          key=$(grep -m1 '^NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=' "$envfile" | cut -d= -f2- | tr -d '"'"'"'')
          if [ -z "$key" ]; then
            echo "::error::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is absent from the pulled production env. Set it in Vercel → Project → Settings → Environment Variables (Production)." >&2
            exit 1
          fi
          case "$key" in
            *ci-placeholder*|*Y2ktcGxhY2Vob2xkZXI*)
              echo "::error::The pulled Clerk key is the CI placeholder. Refusing to deploy — this is what took production down on 2026-08-17." >&2
              exit 1
              ;;
          esac
          echo "Production Clerk key present and not a placeholder."

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          # VERCEL_ORG_ID and VERCEL_PROJECT_ID come from the workflow-level
          # env block and are already present in every step's environment.
          # NOTHING app-related is injected here on purpose: a variable already
          # in the environment overrides .vercel/.env.production.local, which
          # is exactly how the CI placeholder key shipped to production.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
        env:
          # VERCEL_ORG_ID and VERCEL_PROJECT_ID come from the workflow-level
          # env block and are already present in every step's environment.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
