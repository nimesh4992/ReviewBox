name: CI

# Layer 1 robot checks (see docs/decisions.md D000).
# Every PR runs these. The merge button is greyed out until all pass.
#
# These triggers were filtered to `main`. This repository's default branch is
# `master`, and no `main` branch has ever existed — so this workflow ran ZERO
# times across 45 branches and every merged PR. "CI is green" throughout
# CLAUDE.md, docs/today.md and docs/backlog.md was never an observed fact;
# nothing was gated on anything.
#
# `pull_request` is deliberately left unfiltered so CI runs on every PR
# regardless of the target branch, and can't be silently disabled again by a
# branch rename.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

  # No VERCEL_ORG_ID / VERCEL_PROJECT_ID here any more — nothing in this file
  # deploys, so nothing reads them. If you re-add a deploy job, they are
  # identifiers rather than credentials (Vercel's own bot prints both in its
  # public PR comments), so they belong here rather than in secrets. Read the
  # correct pair off any PR's bot comment — its avatar URL carries both:
  #   vercel.com/api/www/avatar?projectId=prj_…&teamId=team_…
  # The org id that used to sit here was wrong for the whole life of the job,
  # which is worth knowing before copying an old value back in.

# ⚠️ THE CI PLACEHOLDER KEYS BELOW MUST NEVER BE WORKFLOW-LEVEL `env`.
#
# They used to be, and it took production down on 2026-08-17.
#
# A workflow-level `env` block applies to EVERY job — including any deploy job
# added later, which is the case that matters. `NEXT_PUBLIC_*` values are inlined into the browser
# bundle at BUILD time, and a variable already present in the process
# environment WINS over the values `vercel pull` writes to
# `.vercel/.env.production.local`. So `vercel build --prod` compiled the real
# production bundle with `ci-placeholder.clerk.accounts.dev` as the Clerk
# publishable key, `vercel deploy --prebuilt --prod` promoted it, and every
# page on app.tryreviewbox.com answered:
#
#   {"errors":[{"message":"Invalid host","code":"host_invalid"}]}
#
# The deploy job reported SUCCESS the whole time — it deployed exactly what it
# was told to build.
#
# Rule: any job that DEPLOYS must inherit no build-time app config from CI.
# Placeholders belong to the jobs that compile or run the app for TESTS only,
# which is why each one now carries its own copy.
#
# No job here deploys today (see the note where deploy-production used to be),
# so this rule currently guards nothing — keep it anyway. It is precisely what
# makes re-adding a deploy job safe, and it was written after the rule's
# absence took production down.
#
# The publishable key must be STRUCTURALLY valid, not just a placeholder
# string: Clerk base64-decodes it to find the frontend API domain, and the old
# `pk_test_ci-placeholder` threw "Publishable key not valid" on every request,
# so `next dev` never became ready and the e2e job timed out after 120s. The
# value below decodes to `ci-placeholder.clerk.accounts.dev$`.

jobs:
  build-and-typecheck:
    name: Build + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Test-only placeholders — see the warning above the `jobs:` key. These
    # compile a throwaway bundle that is never deployed.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Test-only placeholders — see the warning above the `jobs:` key.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Test-only placeholders — see the warning above the `jobs:` key.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # NON-BLOCKING until real Clerk test credentials are added as repo secrets.
  #
  # All 20 specs fail, and the first CI run showed exactly why: the dummy key
  # above is structurally valid (so `next dev` boots) but names a Clerk
  # instance that does not exist, so Clerk's edge answers every request with
  #
  #   {"errors":[{"message":"Invalid host","code":"host_invalid"}]}
  #
  # …including the purely public marketing pages. No app change can fix that
  # from this side; the tests need credentials that resolve to a real Clerk
  # instance. (Note the product-side implication, tracked as BUG-040: a Clerk
  # outage currently takes the marketing site and legal pages down with it.)
  #
  # To make this blocking (recommended — it is the only check that exercises
  # the app as a user):
  #   1. Clerk dashboard → a dedicated CI development instance → API keys
  #   2. GitHub → Settings → Secrets and variables → Actions → add
  #      CLERK_PUBLISHABLE_KEY_TEST and CLERK_SECRET_KEY_TEST
  #   3. Reference them in the `env:` block below and drop continue-on-error
  # Tracked as BUG-037 in docs/BUGS.md.
  e2e-tests:
    name: E2E tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    # Test-only placeholders — see the warning above the `jobs:` key.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      # A green tick on this job has meant "0 tests ran" for weeks. This step
      # makes the job state its own result in the checks UI, and fails if the
      # suite went vacuous for a reason nobody declared. See BUG-037 / audit H-8.
      - name: Report what actually executed
        if: always()
        run: node scripts/e2e-execution-report.mjs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Blocks the merge. Nothing is currently critical, so a red here is a
      # genuine new problem rather than pre-existing debt.
      #
      # Wrapped in a retry because a bare `npm audit` conflates two very
      # different outcomes — both exit 1:
      #   1. a critical advisory exists  → must block the merge
      #   2. the registry answered 4xx/5xx → tells us nothing at all
      # We hit (2) on c844e9d: the legacy /security/audits/quick endpoint, which
      # npm's own notice says is being retired, returned "400 Invalid package
      # tree" for a lockfile that had audited clean 44 minutes earlier. Failing
      # the merge gate on npm's uptime is how a pipeline gets ignored.
      #
      # So: retry transient registry errors, fail loudly on real advisories,
      # and if the registry never answers, pass with a visible warning rather
      # than a silent green — the run is UNVERIFIED, and the log says so.
      - name: npm audit (critical blocks the merge)
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level=critical 2>&1); then
              echo "$out"
              echo "No critical advisories."
              exit 0
            fi
            if grep -qE "audit endpoint returned an error|Invalid package tree|ENETUNREACH|ETIMEDOUT|socket hang up" <<<"$out"; then
              echo "::warning::npm audit registry error on attempt ${attempt}/3 — retrying."
              tail -n 5 <<<"$out"
              sleep $((attempt * 5))
              continue
            fi
            echo "$out"
            echo "::error::Critical advisories found — see the npm audit output above."
            exit 1
          done
          echo "::warning::npm audit could not reach the registry after 3 attempts. Advisory status is UNVERIFIED for this run, not clean."

      # Reports but does not block. `--audit-level=high` cannot pass today: the
      # remaining high advisories are eslint-toolchain and vitest devDeps whose
      # only fix is a semver-major jump (ESLint 9, eslint-config-next 16 → which
      # pulls Next 16), plus next/postcss/sharp which have NO fix published yet.
      # CLAUDE.md defers the Next 16 upgrade until it is stable. Blocking on
      # this would mean a permanently red pipeline, which is how a pipeline
      # gets ignored. Tracked as BUG-036 in docs/BUGS.md — revisit with Next 16.
      - name: npm audit (high severity — advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── Production deploy: DELIBERATELY ABSENT ─────────────────────────────────
  #
  # Vercel's Git integration deploys master. There is no deploy job here, and
  # adding one back needs a reason that survives the history below.
  #
  # There was one — `deploy-production`, a CLI deploy — removed 2026-08-19 on
  # the founder's call. It was written because Vercel's Git integration refused
  # this repo:
  #
  #   Deployment Blocked — the commit author did not have contributing access
  #   The Hobby Plan does not support collaboration for private repositories
  #
  # Note "private". The repo is public now, so the block lapsed and the
  # integration resumed on its own — every Vercel deployment record carries
  # `githubRepoVisibility: "public"`. Nothing updated the comment, so for two
  # days a failing CLI job painted master red while the site shipped fine
  # without it, and an agent (me) told the founder seven merges were stuck in
  # a queue that did not exist.
  #
  # Verified before removing, against the Vercel API rather than a CI log:
  # dpl_F8nMNiuuMogC8RiT7Mmu3VFqWvKw (commit 0a4af8a, the #127 merge) is
  # state READY, target "production", source "git", aliased to
  # tryreviewbox.com, www.tryreviewbox.com and app.tryreviewbox.com.
  #
  # Two things were genuinely lost with it, so know what you are trading:
  #
  # 1. CI ORDERING. The job carried `needs: [build-and-typecheck, lint,
  #    unit-tests, security-audit]`, so a red master could not reach
  #    production. The Git integration has no such gate — it builds master
  #    whatever CI says. #120 and #121 reached Vercel with a broken master and
  #    failed at Vercel's own build rather than being held back. That is a
  #    worse failure mode than being blocked, but it is a visible one, and it
  #    was already the real behaviour while the CLI job was broken.
  #
  # 2. THE PRODUCTION-ENV GUARD. A step read `.vercel/.env.production.local`
  #    after `vercel pull` and refused to deploy if the Clerk publishable key
  #    was missing or still the CI placeholder — the check that would have
  #    caught the 2026-08-17 outage. That whole class of bug came FROM the CLI
  #    path: `vercel build --prod` inherits the runner's environment, and a
  #    NEXT_PUBLIC_* value already present there beats what `vercel pull`
  #    writes. Vercel's own builder has no CI environment to inherit, so the
  #    guard protected against a hazard that only existed because the job did.
  #
  # The warning above `jobs:` about workflow-level NEXT_PUBLIC_* placeholders
  # still stands and must NOT be relaxed — it is what makes re-adding a deploy
  # job safe, and it is exactly the rule that was broken in 2026-08-17.
  #
  # If you do re-add one: gate it on the four blocking jobs, give it its own
  # env block inheriting nothing app-related from CI, restore the pulled-env
  # guard, and make sure it is not racing the Git integration for the same
  # deployment.
